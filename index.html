<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Glassmorphism Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            overflow-y: auto;
            padding: 20px;
            gap: 30px;
        }

        /* Dedicated Main Download Area */
        .launcher-download-box {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 380px;
            width: 100%;
        }

        .launcher-title {
            color: #ffffff;
            font-size: 1.4rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .launcher-desc {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .native-download-btn {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 213, 0.3);
        }

        .native-download-btn:hover {
            background: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        /* Responsive glass container */
        .calculator-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            padding: 25px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Display Layout */
        .display-screen {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 20px;
            color: #f8fafc;
            font-size: 2rem;
            font-weight: 300;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .display-screen::-webkit-scrollbar {
            display: none;
        }

        /* Grid System */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        /* Interactive Buttons */
        button {
            height: 65px;
            border: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            font-size: 1.3rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover, button.active {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Functional styling hierarchies */
        button.operator {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        button.operator:hover, button.operator.active {
            background: rgba(59, 130, 246, 0.35);
            color: #93c5fd;
        }

        button.clear {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        button.clear:hover, button.clear.active {
            background: rgba(239, 68, 68, 0.25);
        }

        button.equals {
            grid-column: span 2;
            background: #2563eb;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 213, 0.3);
        }

        button.equals:hover, button.equals.active {
            background: #3b82f6;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>

    <!-- SAFE DIRECT USER DOWNLOAD BUTTON: Bypasses script block triggers -->
    <div class="launcher-download-box">
        <h2 class="launcher-title">Radu Launcher</h2>
        <p class="launcher-desc">Get the native desktop workspace launcher installer for Windows.</p>
        <a href="https://github.com" class="native-download-btn">
            Download Installer (.exe)
        </a>
    </div>

    <!-- Calculator Interface container -->
    <div class="calculator-container">
        <div class="display-screen" id="display">0</div>
        
        <div class="buttons-grid">
            <button class="clear" data-key="Escape" onclick="clearDisplay()">C</button>
            <button data-key="_" onclick="appendValue('_')">_</button>
            <button class="operator" data-key="/" onclick="appendValue('/')">÷</button>
            <button class="operator" data-key="*" onclick="appendValue('*')">×</button>
            
            <button data-key="7" onclick="appendValue('7')">7</button>
            <button data-key="8" onclick="appendValue('8')">8</button>
            <button data-key="9" onclick="appendValue('9')">9</button>
            <button class="operator" data-key="-" onclick="appendValue('-')">-</button>
            
            <button data-key="4" onclick="appendValue('4')">4</button>
            <button data-key="5" onclick="appendValue('5')">5</button>
            <button data-key="6" onclick="appendValue('6')">6</button>
            <button class="operator" data-key="+" onclick="appendValue('+')">+</button>
            
            <button data-key="1" onclick="appendValue('1')">1</button>
            <button data-key="2" onclick="appendValue('2')">2</button>
            <button data-key="3" onclick="appendValue('3')">3</button>
            <button class="equals" data-key="Enter" onclick="calculateResult()">=</button>
            
            <button data-key="0" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button data-key="." onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let currentInput = '';
        let shouldReset = false;

        function appendValue(val) {
            if (display.innerText === '0' || shouldReset) {
                currentInput = '';
                shouldReset = false;
            }
            currentInput += val;
            display.innerText = currentInput;
            
            // Fallback: If typed code string triggers, attempt opening fallback link
            if (currentInput.includes('_101')) {
                triggerEasterEgg();
            }
        }

        function clearDisplay() {
            currentInput = '';
            display.innerText = '0';
        }

        function calculateResult() {
            try {
                if (!currentInput) return;
                let result = Function(`"use strict"; return (${currentInput})`)();
                
                display.innerText = Number.isInteger(result) ? result : result.toFixed(4);
                currentInput = display.innerText;
                shouldReset = true;
            } catch (error) {
                display.innerText = 'Error';
                shouldReset = true;
            }
        }

        function triggerEasterEgg() {
            // Backup execution path: Since GitHub prevents automatic cross-origin requests, 
            // this fallback prompts a clean target viewport frame execution handler context.
            window.open('https://github.com', '_blank');
            clearDisplay();
        }

        // Global Physical Keyboard Interface Integration
        document.addEventListener('keydown', (event) => {
            let key = event.key;

            if (key === 'c' || key === 'C') key = 'Escape';
            
            const targetButton = document.querySelector(`button[data-key="${key}"]`);
            
            if (targetButton) {
                event.preventDefault();
                
                targetButton.classList.add('active');
                targetButton.click();
                
                setTimeout(() => targetButton.classList.remove('active'), 150);
            }
        });
    </script>
</body>
</html>
